name: Scrape and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # The city updates its schedule/closure PDFs on an irregular, infrequent
    # basis, so twice a day is enough to stay current.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape sandiego.gov/pools
        run: npm run scrape

      - name: Build frontend
        run: npm run build --workspace web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
